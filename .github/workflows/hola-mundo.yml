name: Hola mundo

on: 
  workflow_dispatch: #ejecución manua
  push:
    branches:
      - main
    paths:
      - 'BibliotecaAPI/**'
      - '.github/workflows/hola-mundo.yml'
  pull_request:
    branches:
      - main
jobs:
  saludar:
